name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No registry-url: setup-node v7 then writes an .npmrc holding ${NODE_AUTH_TOKEN} and no longer
      # exports a dummy value (the "Breaking change" note of its v7 README), and yarn 1 refuses an
      # unset variable in its config. npm's Trusted Publishing (OIDC) needs no token and uses the
      # default registry.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Upgrade npm (Trusted Publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Publish to npm
        run: npm publish
