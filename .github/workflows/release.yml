name: Release

# Publishes polydoc-mcp to npm via Trusted Publishing (OIDC), so no NPM_TOKEN is needed.
# Provenance attestations are generated automatically. A release runs from a vX.Y.Z tag: push
# the tag, or dispatch the workflow on one. A dispatch on a branch ends the run green and
# publishes nothing.
#
# One-time setup on npmjs.com: configure polydoc-tech/polydoc-mcp as a Trusted Publisher for
# the polydoc-mcp package (package Settings -> Publishing access -> GitHub Actions, workflow
# `release.yml`, environment `release`).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Per job, not here: zizmor's excessive-permissions audit refuses a workflow-wide
# `id-token: write` once more than one job could mint the token.
permissions:
  contents: read

jobs:
  # workflow_dispatch offers every branch, so a release can be started from a place that must
  # never publish. That is a mistake, not a fault, so the run ends green with a notice and
  # nothing is published.
  #
  # Gating at job level rather than inside `publish` keeps the whole publish job behind one
  # decision, so a step added to it later cannot run on a refused dispatch. It also leaves the
  # `release` environment unrequested on a non-tag ref, which is what lets the run end green
  # at all: the environment's `v*.*.*` tag policy fails any job it blocks, whatever that
  # job's own first step does.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reads nothing, publishes nothing. The npm OIDC token is minted only in `publish`,
    # inside the `release` environment.
    permissions: {}
    outputs:
      release: ${{ steps.decide.outputs.release }}
    steps:
      - name: Release only from a vX.Y.Z tag
        id: decide
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::a release runs from a vX.Y.Z tag, not from $GITHUB_REF, so nothing was published"
          fi

  publish:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest # Trusted Publishing requires a cloud-hosted runner
    timeout-minutes: 15
    # One publish at a time, never cancelled midway. GitHub keeps one waiting job per group,
    # so a third tag cancels the waiting one; re-run it. The group does not fix the order: of
    # two tags pushed together, either can publish last and take npm's `latest` dist-tag. On
    # this job and not the workflow: a job its `if` skips joins no group, so a dispatch on a
    # branch cannot cancel a waiting release.
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    # The half an edit to this file cannot remove. GitHub refuses to start the job unless the
    # ref matches this environment's `v*.*.*` tag policy, and npm only accepts a Trusted
    # Publishing token from a run in it.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the guard below needs main's history
          persist-credentials: false

      # `gate` has settled that the ref is a vX.Y.Z tag; a tag can still point at any commit,
      # so this is the other half. It is no defence against an edit to this file: a tag runs
      # the workflow as of its commit. The `release` environment above is that defence.
      # Unlike a dispatch from a branch, a tag off main is a fault worth a red run.
      - name: The tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $(git rev-parse --short HEAD), which is not on main"
            exit 1
          fi

      # No `registry-url`: it writes an `.npmrc` with a token placeholder that npm would use
      # instead of OIDC, so publish would fail with a 404, and yarn 1 refuses the unset
      # variable it holds. npm defaults to registry.npmjs.org and uses Trusted Publishing when
      # the token-auth `.npmrc` is absent.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          # No dependency cache in a publishing job: a poisoned cache would ship.
          package-manager-cache: false

      # The checks that need no install come first, so a refused tag fails in seconds, before
      # any dependency's install script runs.

      # server.json is the MCP Registry entry, and it names the npm version it lists.
      - name: package.json and server.json versions match the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          for field in "package.json .version" "server.json .version" "server.json .packages[0].version"; do
            have="$(jq -r "${field#* }" "${field%% *}")"
            test "$want" = "$have" || {
              echo "::error::tag says $want, $field says $have"
              exit 1
            }
          done

      # The same check as in ci.yml. A tag can sit on a main commit whose CI went red, and this
      # job does not read that run.
      - name: CHANGELOG.md has a heading for the package.json version
        run: |
          v="$(node -p "require('./package.json').version")"
          grep -qE "^## ${v//./\\.} - [0-9]{4}-[0-9]{2}-[0-9]{2}\$" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## $v - <date>' heading"
            exit 1
          }

      # Trusted Publishing + automatic provenance need npm >= 11.5.1. Pinned, not @latest,
      # so a new npm release reaches a publish only through a reviewed bump.
      - name: Upgrade npm
        # renovate: datasource=npm depName=npm
        run: npm install -g npm@12.2.3

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Publish to npm
        run: npm publish
